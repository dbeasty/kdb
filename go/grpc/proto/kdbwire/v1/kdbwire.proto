syntax = "proto3";

// The KDB wire protocol, carried over HTTP/2.
//
// This is deliberately a transport, not a second protocol. The payload of every Frame is one
// complete, length-prefixed KDB wire frame - byte for byte what the TCP and WebSocket listeners
// carry (see docs/kdb-spec-layer7-component21-wire-protocol-framing.md). Everything that gives
// those frames meaning - the handshake and its authentication, RBAC, sessions, SQL execution -
// is unchanged and shared, so a client that can already encode KDB frames needs no new codec to
// speak this, and there is no second dispatch table to keep in step with the wire message types.
package kdb.wire.v1;

option go_package = "github.com/limidus/kdb/go/grpc/gen/kdbwire/v1;kdbwirev1";

service KdbWire {
  // Connect carries one client connection.
  //
  // One stream is one connection, and that is load-bearing rather than incidental. Sessions are
  // scoped to a connection: they are authenticated once at handshake time and reused for every
  // later frame, they own document locks, and they require that two frames naming the same
  // session are served in the order they were sent. A single bidirectional stream preserves all
  // of that; spreading one client's frames over several concurrent streams would not, because
  // HTTP/2 gives no ordering between streams.
  //
  // When the stream ends, every session opened on it is closed and every document lock it held
  // is released - the same lifecycle a dropped TCP connection gets.
  rpc Connect(stream Frame) returns (stream Frame);
}

message Frame {
  // One complete, length-prefixed KDB wire frame.
  bytes payload = 1;
}
