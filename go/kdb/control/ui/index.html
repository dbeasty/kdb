<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KDB Control</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --panel: #fff; --border: #e3e1dd; --text: #1f1e1c; --muted: #6b6862;
    --accent: #3f6ad8; --added: #2f8a4f; --modified: #b07d1a; --removed: #c0392b;
    --chip: #f0eeea; --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1e2023; --border: #32353a; --text: #e6e4e0; --muted: #9a978f;
      --accent: #7fa0ef; --added: #5cbd7d; --modified: #d8ab4c; --removed: #e0705f;
      --chip: #2a2d31;
    }
  }
  * { box-sizing: border-box; }
  /* A display rule on a selector beats the hidden attribute's UA default, so nav and button
     elements would stay visible while "hidden". Restate it once, decisively. */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header .sp { flex: 1; }
  .ns { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .head-hash { font-family: var(--mono); font-size: 12px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--added); }
  .dot.err { background: var(--removed); }
  nav { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
  nav button {
    background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted);
    padding: 9px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: 16px; max-width: 1100px; }
  .row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .col { flex: 1 1 380px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .card h2 { margin: 0; padding: 10px 12px; font-size: 12px; font-weight: 600;
             text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
             border-bottom: 1px solid var(--border); }
  .card .body { padding: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  tr.sel td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  tbody tr.pick { cursor: pointer; }
  tbody tr.pick:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--chip);
          font-size: 11px; color: var(--muted); white-space: nowrap; }
  .chip.ref { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--text); }
  .chip.added { color: var(--added); } .chip.modified { color: var(--modified); } .chip.removed { color: var(--removed); }
  .warn { border-left: 3px solid var(--modified); background: color-mix(in srgb, var(--modified) 10%, transparent);
          padding: 8px 10px; border-radius: 4px; margin: 6px 0; font-size: 12px; }
  .err { border-left: 3px solid var(--removed); background: color-mix(in srgb, var(--removed) 10%, transparent);
         padding: 8px 10px; border-radius: 4px; margin: 8px 0; font-size: 13px; }
  .muted { color: var(--muted); }
  .empty { padding: 20px 12px; color: var(--muted); font-size: 13px; text-align: center; }
  input, button.act {
    font: inherit; padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text);
  }
  button.act { cursor: pointer; background: var(--panel); }
  button.act:hover { border-color: var(--accent); }
  .gate { max-width: 460px; margin: 60px auto; }
  .gate p { color: var(--muted); font-size: 13px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  select.ns { background: var(--bg); color: var(--text); border: 1px solid var(--border);
              border-radius: 6px; padding: 3px 6px; font-size: 12px; }
  textarea.sql { width: 100%; min-height: 96px; font-family: var(--mono); font-size: 13px;
                 padding: 8px; border: 1px solid var(--border); border-radius: 6px;
                 background: var(--bg); color: var(--text); resize: vertical; }
  .grid-wrap { overflow-x: auto; }
  td.cell { max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  pre.doc { margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 12px;
            white-space: pre-wrap; overflow-wrap: anywhere; }
  textarea.doc { width: 100%; min-height: 200px; font-family: var(--mono); font-size: 12px;
                 padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
                 background: var(--bg); color: var(--text); resize: vertical; }
  /* Time travel is a mode, not a filter: it has to be impossible to miss that what is on screen
     is not current. Hence a full-width bar rather than a subtle badge. */
  .timebar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 13px;
             background: color-mix(in srgb, var(--modified) 22%, var(--panel));
             border-bottom: 1px solid var(--border); }
  .timebar strong { font-family: var(--mono); }
  .danger { border-color: var(--removed); color: var(--removed); }
  dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
           color: var(--text); max-width: 560px; width: 92%; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin: 0; padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }
  dialog .body { padding: 14px; }
  dialog footer { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 14px;
                  border-top: 1px solid var(--border); }
  .scroll { max-height: 220px; overflow: auto; }
</style>
</head>
<body>
<header>
  <h1>KDB Control</h1>
  <select id="nspick" class="ns" title="Namespace"></select>
  <span class="head-hash muted" id="head"></span>
  <span class="sp"></span>
  <span class="live"><span class="dot" id="livedot"></span><span id="livetext">offline</span></span>
  <button class="act" id="signout" hidden>Sign out</button>
</header>
<nav id="tabs" hidden>
  <button data-tab="data" aria-selected="true">Data</button>
  <button data-tab="sql" aria-selected="false">SQL</button>
  <button data-tab="commits" aria-selected="false">Commits</button>
  <button data-tab="refs" aria-selected="false">Refs</button>
  <button data-tab="schema" aria-selected="false">Schema</button>
  <button data-tab="settings" aria-selected="false">Settings</button>
  <button data-tab="ops" aria-selected="false">Ops</button>
  <button data-tab="recovery" aria-selected="false">Recovery</button>
</nav>
<div class="timebar" id="timebar" hidden>
  <span id="atmsg">Viewing at <strong id="atref"></strong> — this is a past state, and it is read-only.</span>
  <span class="sp" style="flex:1"></span>
  <button class="act" id="exitat">Return to HEAD</button>
</div>
<main id="main"></main>
<dialog id="revertdlg"><h3>Revert</h3><div class="body" id="revertbody"></div>
  <footer><button class="act" id="revertcancel">Cancel</button>
  <button class="act danger" id="revertgo">Revert</button></footer></dialog>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
};

// The control plane authenticates every request, so the page needs a credential before it can
// show anything. It is held in sessionStorage - gone when the tab closes - and never written to
// the URL, where it would end up in history and logs.
const TOKEN_KEY = "kdb.control.token";
let token = sessionStorage.getItem(TOKEN_KEY) || "";
// `at` is the revision every view reads at: null means head. It is a mode rather than a per-view
// filter, so it lives here and every fetch consults it.
let state = { ns: null, namespaces: [], tab: "data", commits: [], selected: null, hasMore: false,
              es: null, at: null, canWrite: false,
              docs: [], docCursor: null, docsMore: false, openDoc: null, editing: null,
              sqlText: "SELECT * FROM users", sqlResult: null, sqlError: null, settings: null };

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: "Bearer " + token },
  });
  if (res.status === 401) { signOut("Those credentials were rejected."); throw new Error("unauthenticated"); }
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { /* non-JSON error page */ }
  if (!res.ok) {
    const msg = body && body.error ? body.error.message : (text || res.statusText);
    const err = new Error(msg); err.code = body && body.error ? body.error.code : String(res.status);
    throw err;
  }
  return body;
}

function signOut(why) {
  token = ""; sessionStorage.removeItem(TOKEN_KEY);
  if (state.es) { state.es.close(); state.es = null; }
  renderGate(why);
}

function renderGate(message) {
  $("tabs").hidden = true; $("signout").hidden = true;
  // The namespace picker is emptied rather than hidden: an option list left over from a previous
  // session would offer namespaces this one has not authenticated for.
  setKids($("nspick"), );
  $("head").textContent = "";
  $("timebar").hidden = true;
  setLive(false, "offline");
  const input = el("input", { type: "password", id: "tok", placeholder: "user:password or token",
                              style: "width:100%;margin:8px 0", autocomplete: "current-password" });
  const submit = () => {
    const v = input.value.trim();
    if (!v) return;
    token = v; sessionStorage.setItem(TOKEN_KEY, v); boot();
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  setMain(el("div", { class: "gate" },
    el("div", { class: "card" },
      el("h2", { text: "Sign in" }),
      el("div", { class: "body" },
        message ? el("div", { class: "err", text: message }) : null,
        el("p", { text: "This control plane authenticates every request. Credentials are held for this tab only." }),
        input,
        el("button", { class: "act", onclick: submit, text: "Connect" })))));
  input.focus();
}

// setKids replaces a node's children, dropping absent ones.
//
// Node.replaceChildren renders a conditional null as the literal text "null". el() has always
// filtered its children; every direct call to replaceChildren has to as well, and forgetting has
// now produced that bug three separate times. So there are no direct calls left: this is the only
// way children are handed to the DOM.
function setKids(node, ...children) {
  node.replaceChildren(...children.flat()
    .filter((c) => c !== null && c !== undefined && c !== false && c !== ""));
}

function setMain(...children) { setKids($("main"), ...children); }

// enterAt / exitAt switch the whole app between head and a past revision. Everything re-renders,
// because a screen showing a mix of current and historical data would be worse than either.
function enterAt(spec, label) {
  state.at = label || spec;
  selectTab(state.tab);
}

function exitAt() {
  // On a staged copy the bar's button means "leave the copy"; on a live namespace it means
  // "return to head". One button, because the operator only ever wants out of whatever they are in.
  if (typeof state.ns === "string" && state.ns.startsWith("staged/")) {
    const live = (state.namespaces.find((n) => n.default) || state.namespaces[0] || {}).id;
    if (live) { switchNamespace(live); return; }
  }
  state.at = null;
  drawBanner();
  selectTab(state.tab);
}

// atQuery appends the viewing revision to a URL that supports it.
function atQuery(sep) {
  return state.at ? sep + "at=" + encodeURIComponent(state.at) : "";
}

// The namespace picker is a real switch, not a label: one process can serve several, and the whole
// app follows the selection.
function renderNamespacePicker() {
  const sel = $("nspick");
  setKids(sel, ...state.namespaces.map((n) =>
    el("option", { value: n.id, selected: n.id === state.ns ? "selected" : null }, n.id)));
  sel.disabled = state.namespaces.length < 2;
  sel.title = state.namespaces.length < 2 ? "This server serves one namespace" : "Switch namespace";
}

// drawBanner is the one place the bar above the content is decided. A staged copy and a past
// revision are different situations - a different database versus a different point in time - and
// both have to be impossible to miss, so they share the bar but not the wording.
function drawBanner() {
  const staged = typeof state.ns === "string" && state.ns.startsWith("staged/");
  const bar = $("timebar");
  bar.hidden = !staged && !state.at;
  if (bar.hidden) return;
  if (staged) {
    setKids($("atmsg"), "Viewing a restored copy, not the live database — ",
      el("strong", { text: state.ns }), ". It is read-only.");
    $("exitat").textContent = "Back to the live namespace";
    return;
  }
  setKids($("atmsg"), "Viewing at ", el("strong", { text: state.at }),
    " — this is a past state, and it is read-only.");
  $("exitat").textContent = "Return to HEAD";
}

// switchNamespace is the single path for changing which namespace every view is looking at, used by
// the picker and by attaching a staged restore. Having two of these is what let them disagree.
async function switchNamespace(id, tab) {
  state.ns = id;
  state.namespaces = (await api("/v1/namespaces")).namespaces || state.namespaces;
  renderNamespacePicker();
  // Everything view-shaped belongs to the namespace it came from: a cursor, a selected commit or an
  // open document from another one means nothing here.
  Object.assign(state, { commits: [], selected: null, docs: [], docCursor: null, openDoc: null,
                         editing: null, sqlResult: null, sqlError: null, at: null });
  await selectTab(tab || state.tab);
}

function setLive(on, text, bad) {
  const dot = $("livedot");
  dot.className = "dot" + (bad ? " err" : on ? " on" : "");
  $("livetext").textContent = text;
}

function connectEvents() {
  if (state.es) state.es.close();
  // EventSource cannot set an Authorization header, so the SSE stream is not reachable from this
  // page today. Rather than fake a live indicator, say plainly that updates are manual - a status
  // light that lies is worse than one that admits it is off.
  setLive(false, "manual refresh");
}

async function boot() {
  try {
    const [health, namespaces] = await Promise.all([api("/v1/health"), api("/v1/namespaces")]);
    state.namespaces = namespaces.namespaces || [];
    state.ns = namespaces.default || (state.namespaces[0] || {}).id || health.namespace;
    state.canWrite = health.controlWritesEnabled === true;
    renderNamespacePicker();
    $("tabs").hidden = false; $("signout").hidden = false;
    connectEvents();
    await selectTab(state.tab);
  } catch (e) {
    if (e.message !== "unauthenticated") renderGate("Could not reach the control plane: " + e.message);
  }
}

async function selectTab(tab) {
  state.tab = tab;
  drawBanner();
  for (const b of $("tabs").children) b.setAttribute("aria-selected", String(b.dataset.tab === tab));
  setMain(el("div", { class: "empty", text: "Loading…" }));
  try {
    if (tab === "data") await renderData();
    else if (tab === "sql") await renderSQL();
    else if (tab === "commits") await renderCommits();
    else if (tab === "refs") await renderRefs();
    else if (tab === "schema") await renderSchema();
    else if (tab === "settings") await renderSettings();
    else if (tab === "ops") await renderOps();
    else if (tab === "recovery") await renderRecovery();
  } catch (e) {
    setMain(el("div", { class: "err", text: e.message }));
  }
}

const nsPath = (suffix) => "/v1/ns/" + encodeURIComponent(state.ns) + suffix;

// ---- Data browser -------------------------------------------------------------------------

async function renderData(append = false) {
  const q = new URLSearchParams({ limit: "50" });
  if (append && state.docCursor) q.set("cursor", state.docCursor);
  if (state.at) q.set("at", state.at);
  const page = await api(nsPath("/docs?" + q));
  state.docs = append ? state.docs.concat(page.documents) : page.documents;
  state.docCursor = page.nextCursor || null;
  state.docsMore = page.hasMore === true;
  drawData();
}

function drawData() {
  const rows = state.docs.map((d) => {
    const tr = el("tr", { class: "pick" + (state.openDoc && state.openDoc.docId === d.docId ? " sel" : "") },
      el("td", {}, el("code", { text: d.docId })),
      el("td", { class: "cell" }, el("code", { text: d.preview })),
      el("td", { class: "muted" }, formatBytes(d.sizeBytes)));
    tr.addEventListener("click", () => openDocument(d.docId));
    return tr;
  });

  const list = el("div", { class: "card" },
    el("h2", { text: "Documents" + (state.at ? " at " + state.at : "") }),
    rows.length
      ? el("div", { class: "grid-wrap" }, el("table", {},
          el("thead", {}, el("tr", {}, el("th", { text: "Document" }), el("th", { text: "Preview" }),
                              el("th", { text: "Size" }))),
          el("tbody", {}, rows)))
      : el("div", { class: "empty", text: "This namespace holds no documents." }),
    state.docsMore
      ? el("div", { class: "body" },
          el("button", { class: "act", text: "Load more", onclick: () => renderData(true) }))
      : null);

  const panel = el("div", { class: "card", id: "docpanel" },
    el("h2", { text: "Document" }),
    el("div", { class: "empty", text: "Select a document." }));

  setMain(el("div", { class: "row" },
    el("div", { class: "col", style: "flex:2 1 520px" }, list),
    el("div", { class: "col" }, panel)));

  if (state.openDoc) drawDocument(state.openDoc);
}

async function openDocument(docId) {
  const panel = $("docpanel");
  setKids(panel, el("h2", { text: "Document" }), el("div", { class: "empty", text: "Loading…" }));
  try {
    const doc = await api(nsPath("/docs/" + encodeURIComponent(docId)) + atQuery("?"));
    state.openDoc = doc;
    drawData();
  } catch (e) {
    setKids(panel, el("h2", { text: "Document" }), el("div", { class: "err", text: e.message }));
  }
}

function drawDocument(doc) {
  const editing = state.editing;
  const canEdit = state.canWrite && doc.atHead !== false;

  const meta = el("dl", { class: "kv" },
    el("dt", { text: "Id" }), el("dd", {}, el("code", { text: doc.docId })),
    el("dt", { text: "Commit" }), el("dd", {}, el("code", { text: (doc.commit || "").slice(0, 16) })),
    el("dt", { text: "Read at" }),
    el("dd", { text: doc.atHead === false ? "a past revision (read-only)" : "head" }));

  if (!editing) {
    setKids($("docpanel"), 
      el("h2", { text: doc.docId.slice(0, 8) + "…" }),
      el("div", { class: "body" }, meta,
        el("div", { style: "margin-top:10px;display:flex;gap:8px" },
          canEdit
            ? el("button", { class: "act", text: "Edit", onclick: () => { state.editing = { text: JSON.stringify(doc.body, null, 2) }; drawDocument(doc); } })
            : null,
          canEdit
            ? el("button", { class: "act danger", text: "Delete", onclick: () => deleteDocument(doc) })
            : null,
          !state.canWrite ? el("span", { class: "muted", style: "font-size:12px",
              text: "read-only control plane" }) : null)),
      el("pre", { class: "doc", text: JSON.stringify(doc.body, null, 2) }));
    return;
  }

  const editor = el("textarea", { class: "doc", spellcheck: "false" });
  editor.value = editing.text;
  // Which keys the save would keep, computed as you type rather than reported afterwards. A write
  // is a shallow merge in this engine, so a key deleted in the editor survives - that is worth
  // knowing before pressing save, not after.
  const warn = el("div", {});
  const recheck = () => {
    setKids(warn, );
    let parsed;
    try { parsed = JSON.parse(editor.value); } catch (e) {
      setKids(warn, el("div", { class: "err", text: "Not valid JSON: " + e.message }));
      return null;
    }
    const kept = Object.keys(doc.body || {}).filter((k) => !(k in parsed));
    if (kept.length) {
      setKids(warn, el("div", { class: "warn" },
        "A write merges over the stored document, so ", el("code", { text: kept.join(", ") }),
        " would be kept. To remove a key, delete the document and recreate it."));
    }
    return parsed;
  };
  editor.addEventListener("input", recheck);

  const save = async () => {
    const parsed = recheck();
    if (!parsed) return;
    try {
      const saved = await api(nsPath("/docs/" + encodeURIComponent(doc.docId)), {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ body: parsed, ifContentHash: doc.contentHash }),
      });
      state.editing = null;
      await openDocument(doc.docId);
      await renderData();
      flash("Saved as commit " + (saved.commit || "").slice(0, 8) + ".");
    } catch (e) {
      setKids(warn, el("div", { class: "err", text: e.message }));
    }
  };

  setKids($("docpanel"), 
    el("h2", { text: "Editing " + doc.docId.slice(0, 8) + "…" }),
    el("div", { class: "body" }, meta,
      el("div", { style: "margin-top:10px" }, editor),
      warn,
      el("div", { style: "margin-top:8px;display:flex;gap:8px;align-items:center" },
        el("button", { class: "act", text: "Save", onclick: save }),
        el("button", { class: "act", text: "Cancel",
                       onclick: () => { state.editing = null; drawDocument(doc); } }),
        el("span", { class: "muted", style: "font-size:12px",
          text: "saved only if the document has not changed since it was read" }))));
  recheck();
}

async function deleteDocument(doc) {
  if (!confirm("Delete this document?\n\nIt stays readable in history, and the delete is a commit "
      + "that can be reverted.")) return;
  try {
    await api(nsPath("/docs/" + encodeURIComponent(doc.docId)), {
      method: "DELETE", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ifContentHash: doc.contentHash }),
    });
    state.openDoc = null;
    state.editing = null;
    await renderData();
    flash("Deleted. The document is still readable at any earlier commit.");
  } catch (e) {
    setKids($("docpanel"), el("h2", { text: "Document" }), el("div", { class: "err", text: e.message }));
  }
}

function formatBytes(n) {
  if (typeof n !== "number") return "—";
  return n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " KB";
}

// ---- SQL console --------------------------------------------------------------------------

async function renderSQL() {
  const editor = el("textarea", { class: "sql", spellcheck: "false" });
  editor.value = state.sqlText;
  const run = async () => {
    state.sqlText = editor.value;
    state.sqlError = null;
    try {
      state.sqlResult = await api(nsPath("/sql"), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sql: state.sqlText, at: state.at || undefined }),
      });
    } catch (e) {
      state.sqlResult = null;
      state.sqlError = e.message;
    }
    drawSQL(editor, run);
  };
  // Cmd/Ctrl+Enter runs, which is what every console does; plain Enter stays a newline.
  editor.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); run(); }
  });
  drawSQL(editor, run);
}

function drawSQL(editor, run) {
  const r = state.sqlResult;
  // A write returns a commit rather than rows, so the two results are rendered differently: the
  // useful thing about a write is what it changed and where that landed in history.
  const results = state.sqlError
    ? el("div", { class: "err", text: state.sqlError })
    : r && r.kind === "ddl"
      ? el("div", { class: "body" }, "Schema change applied.")
    : r && r.kind === "dml"
      ? el("div", { class: "body" },
          r.committed
            ? el("div", {},
                el("div", {}, r.rowsAffected + " row" + (r.rowsAffected === 1 ? "" : "s") + " changed."),
                el("div", { class: "muted", style: "margin-top:6px" },
                  "Committed as ", el("code", { text: (r.commit || "").slice(0, 12) }),
                  " — it is ordinary history, and can be reverted from the Commits tab."))
            : el("div", { class: "muted", text: r.note || "Nothing was committed." }))
    : r
      ? el("div", {},
          el("div", { class: "body muted" },
            r.rowCount + " row" + (r.rowCount === 1 ? "" : "s"),
            r.truncated ? el("span", { class: "chip modified", text: "truncated" }) : null,
            el("span", { class: "chip", title: "the access path the executor chose", text: r.plan || "?" }),
            typeof r.rowsExamined === "number"
              ? el("span", { class: "chip", title: "rows examined, not returned", text: r.rowsExamined + " examined" })
              : null),
          r.rows.length
            ? el("div", { class: "grid-wrap" }, el("table", {},
                el("thead", {}, el("tr", {}, r.columns.map((c) => el("th", { text: c })))),
                el("tbody", {}, r.rows.map((row) => el("tr", {},
                  row.map((cell) => el("td", { class: "cell" },
                    el("code", { text: renderCell(cell) }))))))))
            : el("div", { class: "empty", text: "No rows." }))
      : el("div", { class: "empty", text: "Run a query." });

  setMain(
    el("div", { class: "card" },
      el("h2", { text: "Query" + (state.at ? " at " + state.at : "") }),
      el("div", { class: "body" },
        editor,
        el("div", { style: "margin-top:8px;display:flex;gap:8px;align-items:center" },
          el("button", { class: "act", text: "Run", onclick: run }),
          el("span", { class: "muted", style: "font-size:12px",
            text: state.canWrite
              ? "⌘/Ctrl + Enter · writes are enabled and commit immediately"
              : "⌘/Ctrl + Enter · this control plane is read-only, so SELECT only" }),
          state.at
            ? el("span", { class: "chip modified",
                           text: "reading at " + state.at + " — writes not allowed here" })
            : null))),
    el("div", { style: "height:12px" }),
    el("div", { class: "card" }, el("h2", { text: "Results" }), results));
}

// A JSON cell arrives as an object, not a string containing one, so it is stringified for display
// rather than shown as [object Object].
function renderCell(cell) {
  if (cell === null || cell === undefined) return "NULL";
  if (typeof cell === "object") return JSON.stringify(cell);
  return String(cell);
}

async function renderCommits(append = false) {
  const skip = append ? state.commits.length : 0;
  const from = state.at ? "&from=" + encodeURIComponent(state.at) : "";
  const page = await api(nsPath("/log?limit=50&skip=" + skip + from));
  state.commits = append ? state.commits.concat(page.commits) : page.commits;
  state.hasMore = page.hasMore;
  $("head").textContent = page.from ? page.from.slice(0, 8) : "";
  drawCommits();
}

function drawCommits() {
  const rows = state.commits.map((c) => {
    const tr = el("tr", { class: "pick" + (state.selected && state.selected.hash === c.hash ? " sel" : "") },
      el("td", {}, el("code", { text: c.shortHash }),
        // A merge is the one structural fact a flat list loses, so it is called out explicitly.
        c.parents && c.parents.length > 1 ? el("span", { class: "chip", text: "merge" }) : null,
        c.stub ? el("span", { class: "chip", text: "archived" }) : null),
      el("td", {}, c.message || el("span", { class: "muted", text: "(no message)" }),
        ...(c.refs || []).map((r) => el("span", { class: "chip ref", text: r }))),
      el("td", { class: "muted" }, formatTime(c.timestamp)),
      // -1 means the operations were evicted under the retention budget and the count is not
      // knowable without loading them. Showing "0" there would read as "this commit wrote nothing".
      el("td", { class: "muted", title: c.opCount < 0 ? "operations not retained" : "" },
        c.opCount < 0 ? "—" : String(c.opCount)));
    tr.addEventListener("click", () => showCommit(c.hash));
    return tr;
  });
  const list = el("div", { class: "card" },
    el("h2", { text: "Commits" }),
    rows.length
      ? el("table", {},
          el("thead", {}, el("tr", {}, el("th", { text: "Commit" }), el("th", { text: "Message" }),
                              el("th", { text: "When" }), el("th", { text: "Ops" }))),
          el("tbody", {}, rows))
      : el("div", { class: "empty", text: "No commits yet." }),
    state.hasMore
      ? el("div", { class: "body" },
          el("button", { class: "act", text: "Load more", onclick: () => renderCommits(true) }))
      : null);

  const detail = el("div", { class: "card", id: "detail" },
    el("h2", { text: "Commit detail" }),
    el("div", { class: "empty", text: "Select a commit." }));

  setMain(el("div", { class: "row" },
    el("div", { class: "col", style: "flex:2 1 520px" }, list),
    el("div", { class: "col" }, detail)));

  if (state.selected) drawDetail(state.selected);
}

async function showCommit(hash) {
  const detail = $("detail");
  setKids(detail, el("h2", { text: "Commit detail" }), el("div", { class: "empty", text: "Loading…" }));
  try {
    const [c, d] = await Promise.all([
      api(nsPath("/commits/" + hash)),
      api(nsPath("/commits/" + hash + "/diff")).catch((e) => ({ unavailable: e.message })),
    ]);
    state.selected = { hash, commit: c, diff: d };
    drawCommits();
  } catch (e) {
    setKids(detail, el("h2", { text: "Commit detail" }), el("div", { class: "err", text: e.message }));
  }
}

function drawDetail(sel) {
  const c = sel.commit, d = sel.diff;
  const kv = el("dl", { class: "kv" },
    el("dt", { text: "Hash" }), el("dd", {}, el("code", { text: c.commit.hash })),
    el("dt", { text: "Parents" }),
    el("dd", {}, c.commit.parents.length
      ? c.commit.parents.map((p) => el("code", { text: p.slice(0, 8) + " " }))
      : el("span", { class: "muted", text: "none (root commit)" })),
    el("dt", { text: "When" }), el("dd", { text: formatTime(c.commit.timestamp) }),
    el("dt", { text: "Author node" }), el("dd", {}, el("code", { text: c.commit.author })),
    el("dt", { text: "Tree" }), el("dd", {}, el("code", { text: c.commit.treeHash.slice(0, 16) })));

  const opsSection = c.operationsAvailable === false ? el("div", { class: "warn", text: c.operationsNote }) : c.operationsAvailable
    ? (c.operations.length
        ? el("table", {},
            el("thead", {}, el("tr", {}, el("th", { text: "Kind" }), el("th", { text: "Document" }), el("th", { text: "Bytes" }))),
            el("tbody", {}, c.operations.map((o) => el("tr", {},
              el("td", {}, el("span", { class: "chip", text: o.kind })),
              el("td", {}, el("code", { text: o.docId || o.path || "" })),
              el("td", { class: "muted" }, o.bytes ? String(o.bytes) : "")))))
        : el("div", { class: "empty", text: "This commit wrote no operations." }))
    : el("div", { class: "warn", text: c.operationsNote });

  let diffSection;
  if (d && d.unavailable) {
    diffSection = el("div", { class: "warn", text: d.unavailable });
  } else if (d && d.entries && d.entries.length) {
    diffSection = el("div", {},
      el("div", { class: "body" },
        el("span", { class: "chip added", text: "+" + d.counts.added }), " ",
        el("span", { class: "chip modified", text: "~" + d.counts.modified }), " ",
        el("span", { class: "chip removed", text: "−" + d.counts.removed })),
      el("table", {},
        el("thead", {}, el("tr", {}, el("th", { text: "Change" }), el("th", { text: "Document" }))),
        el("tbody", {}, d.entries.map((e) => el("tr", {},
          el("td", {}, el("span", { class: "chip " + e.change, text: e.change })),
          el("td", {}, el("code", { text: e.docId })))))));
  } else {
    diffSection = el("div", { class: "empty", text: "No document changes against the first parent." });
  }

  const actions = el("div", { class: "body", style: "display:flex;gap:8px;flex-wrap:wrap" },
    el("button", { class: "act", text: "View at this commit",
                   onclick: () => enterAt(c.commit.hash, c.commit.shortHash) }),
    // Revert is offered whatever the write setting: planning is a read, and the dialog reports the
    // refusal if applying is not allowed. Hiding it would leave an operator unable to find out
    // what a revert would even do.
    el("button", { class: "act danger", text: "Revert to this commit",
                   title: state.canWrite ? "" : "This control plane is read-only; you can preview the revert but not apply it",
                   onclick: () => openRevert(c.commit.hash, c.commit.shortHash) }));

  setKids($("detail"), 
    el("h2", { text: "Commit " + c.commit.shortHash }),
    el("div", { class: "body" }, el("strong", { text: c.commit.message || "(no message)" }), kv),
    actions,
    el("h2", { text: "Operations" }), opsSection,
    el("h2", { text: "Changed documents" }), diffSection);
}

const SOURCE_HELP = {
  flag: "set explicitly on the command line",
  env: "set in the environment",
  file: "set in the config file",
  default: "built-in default",
  auto: "detected by the process at startup",
  runtime: "changed since startup through the control plane",
};

async function renderSettings() {
  const s = await api("/v1/settings");
  state.settings = s;
  const live = new Set(s.mutableKeys || []);
  const drifted = new Set(s.drift || []);

  const groups = new Map();
  for (const d of s.settings) {
    const g = d.key.split(".")[0];
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(d);
  }
  const warnings = s.settings.flatMap((d) => (d.warnings || []).map((w) => ({ key: d.key, w })));

  const cards = [...groups.entries()].map(([name, items]) => el("div", { class: "card" },
    el("h2", { text: name }),
    el("table", {},
      el("thead", {}, el("tr", {}, el("th", { text: "Setting" }), el("th", { text: "Value" }),
                          el("th", { text: "Source" }), el("th", { text: "Changeable" }))),
      el("tbody", {}, items.map((d) => settingRow(d, live.has(d.key), drifted.has(d.key), s))))));

  setMain(
    drifted.size
      ? el("div", { class: "card" }, el("h2", { text: "Changed since startup" }),
          el("div", { class: "body" },
            el("div", { class: "warn" },
              drifted.size + " setting" + (drifted.size === 1 ? " differs" : "s differ") +
              " from what this process started with, so a restart would undo " +
              (drifted.size === 1 ? "it" : "them") + ": ",
              el("code", { text: [...drifted].join(", ") }),
              s.canPersist ? "" : " — this deployment does not let the server write its config file."),
            el("button", { class: "act", text: "Show detail", onclick: showDrift })))
      : null,
    warnings.length
      ? el("div", { class: "card" }, el("h2", { text: "Ignored configuration" }),
          el("div", { class: "body" },
            el("p", { class: "muted", style: "margin-top:0",
                      text: "The engine reads these variables leniently: a value it cannot parse is discarded and the default used, with no error and no log line. They are listed here because that is otherwise invisible." }),
            warnings.map((x) => el("div", { class: "warn", text: x.w }))))
      : null,
    !s.canChange
      ? el("div", { class: "body muted", style: "padding:0 0 8px",
          text: "This control plane is read-only, so nothing here can be changed. Start the service with --control-write to enable it." })
      : null,
    el("div", {}, cards));
}

// settingRow renders one setting, with an inline editor when this process can actually change it.
function settingRow(d, isLive, isDrifted, s) {
  const valueCell = el("td", {});
  const editable = isLive && s.canChange;

  const showValue = () => {
    setKids(valueCell, 
      el("code", { text: formatValue(d.value) }), d.unit ? " " + d.unit : "",
      isDrifted ? el("span", { class: "chip modified", text: "changed" }) : null,
      editable
        ? el("button", { class: "act", style: "margin-left:8px;padding:2px 8px;font-size:12px",
                         text: "Change", onclick: startEdit })
        : null,
      ...(d.warnings || []).map((w) => el("div", { class: "warn", text: w })));
  };

  const startEdit = () => {
    const input = el("input", { type: "text", style: "width:120px" });
    input.value = d.value === null || d.value === undefined ? "" : String(d.value);
    const status = el("span", { class: "muted", style: "font-size:12px" });
    const commit = async (dryRun) => {
      status.textContent = dryRun ? "checking…" : "applying…";
      try {
        const res = await api("/v1/settings", {
          method: "PATCH", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            dryRun, expectRevision: s.revision,
            changes: [{ key: d.key, value: coerce(d, input.value) }],
          }),
        });
        const outcome = (res.changes || [])[0] || {};
        if (!outcome.applied) {
          setKids(status, el("span", { class: "err", text: outcome.refused || "refused" }));
          return;
        }
        if (dryRun) {
          status.textContent = "would change " + formatValue(outcome.from) + " → " + formatValue(outcome.to);
          return;
        }
        await renderSettings();
      } catch (e) {
        setKids(status, el("span", { class: "err", text: e.message }));
      }
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") commit(false); });
    setKids(valueCell, input,
      el("div", { style: "margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap" },
        el("button", { class: "act", style: "padding:2px 8px;font-size:12px", text: "Check",
                       title: "validate without changing anything", onclick: () => commit(true) }),
        el("button", { class: "act", style: "padding:2px 8px;font-size:12px", text: "Apply",
                       onclick: () => commit(false) }),
        el("button", { class: "act", style: "padding:2px 8px;font-size:12px", text: "Cancel",
                       onclick: showValue }),
        status));
    input.focus();
  };

  showValue();
  return el("tr", {},
    el("td", {}, el("code", { text: d.key }),
      d.help ? el("div", { class: "muted", style: "font-size:12px", text: d.help }) : null),
    valueCell,
    el("td", {}, el("span", { class: "chip", title: SOURCE_HELP[d.source] || "", text: d.source }),
      el("div", { class: "muted", style: "font-size:11px", text: d.sourceDetail || "" })),
    el("td", {}, el("span", { class: "chip", text: mutabilityLabel(d.mutability) }),
      isLive && !s.canChange
        ? el("div", { class: "muted", style: "font-size:11px", text: "read-only plane" })
        : null));
}

// coerce turns the text in the box into the JSON type the setting expects. A number typed into a
// numeric setting must not arrive as a string, or the server refuses it for the wrong reason.
function coerce(d, text) {
  const t = text.trim();
  if (typeof d.value === "number") {
    const n = Number(t);
    return Number.isFinite(n) ? n : t;
  }
  if (typeof d.value === "boolean") return t === "true";
  return t;
}

// Revert is deliberately three steps: preview, read what will change, then confirm by typing the
// namespace. The preview is a server-computed plan and the apply is checked against the head that
// plan was made from, so what is applied is what was shown.
async function openRevert(spec, label) {
  const dlg = $("revertdlg");
  const body = $("revertbody");
  setKids(body, el("div", { class: "empty", text: "Planning…" }));
  $("revertgo").disabled = true;
  dlg.showModal();

  let plan;
  try {
    plan = await api(nsPath("/revert/plan"), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to: spec }),
    });
  } catch (e) {
    setKids(body, el("div", { class: "err", text: e.message }));
    return;
  }

  if (plan.noop) {
    setKids(body, el("div", { class: "empty",
      text: "The database is already in that state. Nothing would change." }));
    return;
  }

  const confirmField = el("input", { type: "text", placeholder: state.ns,
                                     style: "width:100%;margin-top:6px" });
  const arm = () => { $("revertgo").disabled = confirmField.value.trim() !== state.ns; };
  confirmField.addEventListener("input", arm);

  setKids(body, 
    el("p", { style: "margin-top:0" },
      "Restore the state at ", el("code", { text: label || spec }), ". This writes a ",
      el("strong", { text: "new commit" }),
      " — history is not rewritten, and this revert can itself be reverted."),
    el("div", {},
      el("span", { class: "chip modified", text: plan.willRestore + " restored" }), " ",
      el("span", { class: "chip removed", text: plan.willRemove + " removed" })),
    el("div", { class: "scroll", style: "margin:10px 0" },
      el("table", {}, el("tbody", {}, plan.entries.map((e) => el("tr", {},
        el("td", {}, el("span", { class: "chip " + e.change, text: revertVerb(e.change) })),
        el("td", {}, el("code", { text: e.docId }))))))),
    el("p", { class: "muted", style: "margin-bottom:4px" },
      "Type the namespace to confirm:"),
    confirmField);
  arm();

  $("revertgo").onclick = async () => {
    $("revertgo").disabled = true;
    try {
      const done = await api(nsPath("/revert/apply"), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ to: spec, expectHead: plan.expectHead }),
      });
      dlg.close();
      state.selected = null;
      exitAt();
      await selectTab("commits");
      flash("Reverted in commit " + done.commit.slice(0, 8) +
            " — " + done.restored + " restored, " + done.removed + " removed.");
    } catch (e) {
      setKids(body, el("div", { class: "err", text: e.message }));
    }
  };
}

// The diff is expressed head -> target, so an entry "added" there is one the revert restores.
function revertVerb(change) {
  return { added: "restore", modified: "restore", removed: "remove" }[change] || change;
}

function flash(message) {
  const note = el("div", { class: "card", style: "margin-bottom:12px" },
    el("div", { class: "body", text: message }));
  $("main").prepend(note);
}

// ---- Recovery -----------------------------------------------------------------------------

async function renderRecovery() {
  let jobs = null;
  try { jobs = await api("/v1/restore/staging"); } catch (e) { jobs = { unavailable: e.message }; }
  const [integrity, checkpoints, plan] = await Promise.all([
    api(nsPath("/integrity")),
    api(nsPath("/checkpoints")).catch((e) => ({ error: e.message })),
    api(nsPath("/maintenance/plan")).catch((e) => ({ error: e.message })),
  ]);
  let backups = null;
  try { backups = await api(nsPath("/backups")); } catch (e) { backups = { unavailable: e.message }; }
  setMain(
    integritySection(integrity),
    el("div", { style: "height:12px" }),
    backupSection(backups),
    el("div", { style: "height:12px" }),
    checkpointSection(checkpoints),
    el("div", { style: "height:12px" }),
    restoreSection(jobs, backups),
    el("div", { style: "height:12px" }),
    maintenanceSection(plan));
}

// A staged restore is the answer to "is this backup any good" - the only honest way to answer it is
// to open the thing and look, which is what attaching does.
function restoreSection(jobs, backups) {
  const available = backups && !backups.unavailable ? (backups.backups || []) : [];

  const start = async (backupId, includeLive) => {
    try {
      const res = await api(nsPath("/restore/staging"), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ backupId: backupId || undefined, includeLive: !!includeLive }),
      });
      flash("Restoring into " + res.job.directory + " — this does not touch the live namespace.");
      await renderRecovery();
    } catch (e) {
      flash("Restore could not start: " + e.message);
    }
  };
  const act = async (id, what, body) => {
    try {
      const res = await api("/v1/restore/staging/" + encodeURIComponent(id) + "/" + what, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      if (what === "attach") {
        await switchNamespace(res.attachedAs, "data");
        flash("Attached read-only as " + res.attachedAs +
              ". Every read view is now looking at the restored copy, not the live database.");
        return;
      }
      await renderRecovery();
    } catch (e) {
      flash(what + " failed: " + e.message);
    }
  };

  if (jobs && jobs.unavailable) {
    return el("div", { class: "card" }, el("h2", { text: "Restore for inspection" }),
      el("div", { class: "body muted", text: jobs.unavailable }));
  }

  const controls = el("div", { class: "body", style: "display:flex;gap:8px;align-items:center;flex-wrap:wrap" },
    available.length
      ? el("select", { class: "ns", id: "restorepick" },
          available.map((b) => el("option", { value: b.backupId },
            b.backupId.slice(0, 12) + " · " + formatTime(b.createdAt))))
      : el("span", { class: "muted", style: "font-size:12px", text: "no backups to restore from" }),
    available.length
      ? el("button", { class: "act", text: "Restore for inspection",
          onclick: () => start($("restorepick").value, false) })
      : null,
    available.length
      ? el("button", { class: "act", title: "union the backup with the live log - salvages commits only one of them has",
          text: "Restore + live log", onclick: () => start($("restorepick").value, true) })
      : null);

  const rows = (jobs.jobs || []).map((j) => el("tr", {},
    el("td", {}, el("code", { text: j.id.slice(-9) }),
      el("div", { class: "muted", style: "font-size:12px", text: j.namespace })),
    el("td", {}, el("span", { class: "chip " + (j.state === "complete" ? "added" : j.state === "failed" ? "removed" : ""),
                              text: j.state }),
      j.error ? el("div", { class: "err", text: j.error }) : null,
      j.note ? el("div", { class: "warn", text: j.note }) : null),
    el("td", { class: "muted" }, String(j.appliedCommits || 0)),
    el("td", { class: "muted" }, (j.sourcesUsed || []).join(", ")),
    el("td", {},
      j.state === "complete" && !j.attachedAs
        ? el("button", { class: "act", style: "padding:2px 8px;font-size:12px",
            title: "open it read-only alongside the live namespace",
            text: "Attach", onclick: () => act(j.id, "attach") })
        : null,
      j.attachedAs
        ? el("span", {}, el("span", { class: "chip ref", text: "attached" }),
            el("button", { class: "act", style: "padding:2px 8px;font-size:12px;margin-left:6px",
              text: "Detach", onclick: () => act(j.id, "detach") }))
        : null,
      j.state !== "running"
        ? el("button", { class: "act danger", style: "padding:2px 8px;font-size:12px;margin-left:6px",
            title: "detach and delete the staging directory",
            text: "Discard", onclick: () => act(j.id, "detach", { delete: true }) })
        : null)));

  return el("div", { class: "card" },
    el("h2", { text: "Restore for inspection" }),
    el("div", { class: "body muted", style: "padding-bottom:0" },
      "A restore into a scratch directory, which the live namespace never notices. Attaching one " +
      "opens it read-only alongside production, so the restored data can be checked with these " +
      "same views before it is trusted. Promoting it needs the service stopped."),
    controls,
    rows.length
      ? el("table", {},
          el("thead", {}, el("tr", {}, el("th", { text: "Job" }), el("th", { text: "State" }),
                              el("th", { text: "Commits" }), el("th", { text: "Sources" }),
                              el("th", { text: "" }))),
          el("tbody", {}, rows))
      : el("div", { class: "empty", text: "No staged restores." }));
}

function integritySection(data) {
  const run = async (level) => {
    setMain(el("div", { class: "empty", text: "Verifying at " + level + "… this walks the delta log." }));
    try {
      await api(nsPath("/integrity/verify"), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ level }),
      });
    } catch (e) {
      flash("Verification failed: " + e.message);
    }
    await renderRecovery();
  };

  const buttons = el("div", { class: "body", style: "display:flex;gap:8px;align-items:center;flex-wrap:wrap" },
    el("button", { class: "act", text: "Verify (L1)",
                   title: "framing and CRC only - cheaper", onclick: () => run("L1") }),
    el("button", { class: "act", text: "Verify (L2)",
                   title: "adds commit hashes and the parent closure - reads every commit", onclick: () => run("L2") }),
    el("span", { class: "muted", style: "font-size:12px",
                 text: "a verification walks the whole log, so it is on demand" }));

  if (!data.everRun) {
    return el("div", { class: "card" }, el("h2", { text: "Integrity" }),
      el("div", { class: "body muted", text: data.note }), buttons);
  }

  const r = data.report;
  // Findings on the segment still being written are separated out: under a live server that is the
  // expected shape of an in-progress append, and mixing it in with real damage would cry wolf.
  const real = (r.findings || []).filter((f) => !f.onActiveSegment);
  const active = (r.findings || []).filter((f) => f.onActiveSegment);

  return el("div", { class: "card" },
    el("h2", { text: "Integrity" }),
    el("div", { class: "body" },
      el("div", {},
        el("span", { class: "chip " + (real.length ? "removed" : "added"),
                     text: real.length ? real.length + " finding" + (real.length === 1 ? "" : "s") : "clean" }),
        el("span", { class: "chip", text: r.level }),
        el("span", { class: "muted", style: "font-size:12px",
                     text: " ran " + formatTime(r.ranAt) + " in " + r.tookMs + " ms over " +
                           (r.segments || []).length + " segment(s)" })),
      active.length ? el("div", { class: "warn", text: r.note }) : null),
    buttons,
    real.length
      ? el("table", {},
          el("thead", {}, el("tr", {}, el("th", { text: "Level" }), el("th", { text: "What" }),
                              el("th", { text: "Segment" }), el("th", { text: "Offset" }),
                              el("th", { text: "Repairable" }))),
          el("tbody", {}, real.map((f) => el("tr", {},
            el("td", {}, el("span", { class: "chip", text: f.level })),
            el("td", {}, el("code", { text: f.classification }),
              el("div", { class: "muted", style: "font-size:12px", text: f.detail })),
            el("td", { class: "muted" }, String(f.segment)),
            el("td", { class: "muted" }, String(f.offset)),
            el("td", {}, f.repairable
              ? el("span", { class: "chip modified", text: "repair" })
              : el("span", { class: "chip removed", title: "repair cannot fabricate missing data; this needs a restore", text: "restore" }))))))
      : null);
}

function backupSection(data) {
  if (data && data.unavailable) {
    return el("div", { class: "card" }, el("h2", { text: "Backups" }),
      el("div", { class: "body muted", text: data.unavailable }));
  }
  const create = async (base) => {
    try {
      const made = await api(nsPath("/backups"), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(base ? { baseBackupId: base } : {}),
      });
      await renderRecovery();
      flash("Backup " + made.backupId.slice(0, 8) + " written" +
            (made.note ? " — " + made.note : "."));
    } catch (e) {
      flash("Backup failed: " + e.message);
    }
  };
  const verify = async (id) => {
    try {
      const res = await api(nsPath("/backups/" + encodeURIComponent(id) + "/verify"), { method: "POST" });
      flash(res.clean
        ? "Backup " + id.slice(0, 8) + " verified: " + res.objects + " objects re-hashed and intact."
        : "Backup " + id.slice(0, 8) + " has problems: " + (res.problems || []).join("; "));
    } catch (e) {
      flash("Verify failed: " + e.message);
    }
  };
  const rows = (data.backups || []).map((b) => el("tr", {},
    el("td", {}, el("code", { text: b.backupId.slice(0, 12) }),
      b.incremental ? el("span", { class: "chip", title: "based on " + b.baseBackupId, text: "incremental" }) : null),
    el("td", { class: "muted" }, formatTime(b.createdAt)),
    el("td", { class: "muted" }, String(b.commitCount)),
    el("td", { class: "muted" }, formatBytes(b.sizeBytes)),
    el("td", {},
      el("button", { class: "act", style: "padding:2px 8px;font-size:12px", text: "Verify",
                     onclick: () => verify(b.backupId) }),
      el("button", { class: "act", style: "padding:2px 8px;font-size:12px;margin-left:6px",
                     title: "take a new backup that references this one",
                     text: "Incremental", onclick: () => create(b.backupId) }))));

  return el("div", { class: "card" },
    el("h2", { text: "Backups" }),
    el("div", { class: "body", style: "display:flex;gap:8px;align-items:center;flex-wrap:wrap" },
      el("button", { class: "act", text: "Back up now", onclick: () => create(null) }),
      el("span", { class: "muted", style: "font-size:12px", text: data.directory || "" })),
    rows.length
      ? el("table", {},
          el("thead", {}, el("tr", {}, el("th", { text: "Backup" }), el("th", { text: "Created" }),
                              el("th", { text: "Commits" }), el("th", { text: "Size" }), el("th", { text: "" }))),
          el("tbody", {}, rows))
      : el("div", { class: "empty", text: "No backups yet. An unverified backup is a guess; an absent one is worse." }));
}

function checkpointSection(data) {
  if (data.error) {
    return el("div", { class: "card" }, el("h2", { text: "Restart cost" }),
      el("div", { class: "body muted", text: data.error }));
  }
  return el("div", { class: "card" },
    el("h2", { text: "Restart cost" }),
    el("div", { class: "body" },
      data.fileBacked
        ? el("dl", { class: "kv" },
            el("dt", { text: "Delta segments" }), el("dd", { text: String(data.segments) }),
            el("dt", { text: "Delta log" }), el("dd", { text: formatBytes(data.deltaLogBytes) }),
            el("dt", { text: "Checkpoint" }),
            el("dd", { text: data.checkpointPresent ? "present" : "none - every open replays the whole log" }))
        : null,
      el("div", { class: "muted", style: "font-size:12px;margin-top:8px", text: data.note })));
}

function maintenanceSection(data) {
  if (data.error) {
    return el("div", { class: "card" }, el("h2", { text: "Offline operations" }),
      el("div", { class: "body muted", text: data.error }));
  }
  return el("div", { class: "card" },
    el("h2", { text: "Offline operations" }),
    el("div", { class: "body muted", text: data.note }),
    el("div", {}, (data.operations || []).map((o) => el("div", { class: "body",
        style: "border-top:1px solid var(--border)" },
      el("div", {},
        el("strong", { text: o.name }),
        o.applicable
          ? el("span", { class: "chip modified", text: "indicated" })
          : el("span", { class: "chip", title: o.reason || "", text: "not indicated" })),
      el("pre", { class: "doc", style: "margin:8px 0", text: (o.command || []).join(" ") }),
      el("div", { class: "muted", style: "font-size:12px", text: o.why }),
      el("div", { class: "warn", style: "font-size:12px", text: o.precondition })))));
}

function formatValue(v) {
  if (v === null || v === undefined) return "—";
  if (v === "") return "(empty)";
  if (typeof v === "boolean") return v ? "true" : "false";
  return String(v);
}

function formatTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString();
}

$("tabs").addEventListener("click", (e) => {
  const tab = e.target.dataset && e.target.dataset.tab;
  if (tab) selectTab(tab);
});
$("signout").addEventListener("click", () => signOut());
$("exitat").addEventListener("click", exitAt);
$("nspick").addEventListener("change", (e) => { switchNamespace(e.target.value); });
$("revertcancel").addEventListener("click", () => $("revertdlg").close());

if (token) boot(); else renderGate();
</script>
</body>
</html>
