name: Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

jobs:
  jmh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run JMH benchmarks
        run: ./gradlew :kdb-benchmark:jmh --no-daemon
      - name: Upload JMH results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: |
            kdb-benchmark/build/results/jmh/
            kdb-benchmark/build/reports/jmh/
          if-no-files-found: warn
