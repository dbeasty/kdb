name: CI

# PR checks are sized to finish in a few minutes: the Go suite runs as shards in parallel, with
# -short; Kotlin runs one job per target against a Gradle build cache; and nothing waits on another
# job it does not use. What -short leaves out - the heap-scale and other measurement tests, the soak
# iterations, the full Go<->Kotlin interop set - and the plain `./gradlew build` run every night in
# e2e-nightly.yml. How to run each piece locally: docs/ci.md.
on:
  workflow_dispatch:
  pull_request:
  # Branch pushes without a PR used to run everything too, so every PR ran CI twice and queued
  # behind itself. main still runs on push: that run is what refreshes the caches PRs restore.
  push:
    branches: [main]

concurrency:
  # A new push to a PR supersedes the run still going for the previous one. Each push to main is
  # its own group: GitHub keeps only one pending run per group and cancels the rest, which skipped
  # main commits while the queue was long.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # .github/actions/setup-go-cached: only main's runs write the Go caches.
  SAVE_GO_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  go-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-key: checks
      - name: Go format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Go vet
        run: go vet ./...
      - name: Go Windows cross-compile
        # Cheap guard that runs on every push; go-windows below is what actually exercises it.
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: Go WASM build
        run: |
          GOOS=js GOARCH=wasm go build -o /dev/null ./wasm/demo/
          GOOS=js GOARCH=wasm go build -o /dev/null ./wasm/embed/
          GOOS=js GOARCH=wasm go build -tags kdb_lite -o /dev/null ./wasm/embed/
          go vet -tags kdb_lite ./kdb/storage/io/s3
      - name: Backup and restore drill
        # Live backup -> verify -> restore into a fresh dir while the service is down -> restart
        # -> compare documents and head. Also run as a Go test (TestBackupRestoreDrill, nightly);
        # this step keeps the operator-facing script itself from rotting and prints its log on
        # failure.
        run: ../scripts/backup-restore-drill.sh 100
      - if: env.SAVE_GO_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # The Go suite under the race detector, as shards balanced by measured duration - see
  # scripts/ci/go-test-shard.sh for what each shard runs (`go-test-shard.sh list linux-race`).
  # -short: heavy tests skip or scale down here and run in full nightly. Results come from Go's
  # test cache when neither a package nor anything it depends on changed since main's last run.
  go-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [embed, server, integration, storage, index, rest]
    steps:
      - uses: actions/checkout@v4
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-key: race-${{ matrix.shard }}
      # The Go<->Kotlin interop smoke in kdb/integration runs the Kotlin CLI through gradle.
      - if: matrix.shard == 'integration'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.shard == 'integration'
        uses: gradle/actions/setup-gradle@v4
      - if: matrix.shard == 'integration'
        name: Use the Gradle build cache in every gradle run, including the tests' own
        run: mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}" && printf 'org.gradle.caching=true\norg.gradle.parallel=true\n' >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
      - name: Go test (${{ matrix.shard }})
        env:
          GO_TEST_JSON_DIR: ${{ runner.temp }}/go-test-json
        run: scripts/ci/go-test-shard.sh linux-race ${{ matrix.shard }} -short -timeout 10m
      - name: Upload go test -json (shard balancing data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-json-linux-race-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-test-json/
          retention-days: 7
          if-no-files-found: ignore
      - if: env.SAVE_GO_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  go-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [embed, server, rest]
    steps:
      - uses: actions/checkout@v4
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-key: windows-${{ matrix.shard }}
      - name: Go test (${{ matrix.shard }})
        # No -race: it needs cgo, and the race-enabled run on Linux already covers data races.
        # What this job is for is Windows file semantics - sharing modes, LockFileEx, rename and
        # delete of open files - which only a real Windows filesystem exercises.
        shell: bash
        env:
          GO_TEST_JSON_DIR: ${{ runner.temp }}/go-test-json
        run: scripts/ci/go-test-shard.sh windows ${{ matrix.shard }} -short -timeout 10m
      - name: Upload go test -json (shard balancing data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-json-windows-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-test-json/
          retention-days: 7
          if-no-files-found: ignore
      - if: env.SAVE_GO_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # `./gradlew build` split by target. Together the three run every task `build` runs on Linux
  # (checked with --dry-run; macosArm64 only runs on a macOS host): jvm also compiles every source
  # set's common metadata (allMetadataJar) - `test allTests` never did, which is how an expect
  # declaration only the metadata compiler rejects once broke `build` on main unnoticed. The plain
  # `./gradlew build` runs nightly. With the build cache main's runs fill, a module and the modules
  # that depend on it only compile and test again when they changed.
  kotlin-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: jvm
            tasks: jvmTest test allMetadataJar
          - target: js
            tasks: jsTest jsJar jsBrowserDistribution
          - target: native
            tasks: linuxX64Test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # kdb-replica's live tests build go/cmd/kdb-replicahost and sync against it; the Go they use
      # is the module's, as in the TS jobs (they skip when there is no Go).
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-key: kotlin-${{ matrix.target }}
      # The JS tests run under Mocha's 2 s per-test timeout, and a few heavy ones (zstd corruption
      # scans, HNSW recall) exceed it when they share the runner's 4 cores with Kotlin compiles.
      # So js compiles everything in parallel first, then runs the tests two at a time.
      - name: Kotlin js (compile)
        if: matrix.target == 'js'
        run: ./gradlew compileTestDevelopmentExecutableKotlinJs jsJar jsBrowserDistribution --build-cache --parallel --no-daemon
      - name: Kotlin ${{ matrix.target }} (${{ matrix.tasks }})
        run: ./gradlew ${{ matrix.tasks }} --build-cache --parallel ${{ matrix.target == 'js' && '--max-workers=2' || '' }} --continue --no-daemon
      # Gradle's console output gives the failing assertion's *line* but not its
      # message, and for a test whose body is a runBlocking { } it reports the
      # builder's line rather than the assert's - so a failure here can name a
      # line that contains nothing but `runBlocking {`. That is how the flakiest
      # test in this repo stayed undiagnosed for as long as it did. The XML
      # reports carry both the message and the real stack frame; keeping them
      # turns the next failure into a diagnosis instead of an investigation.
      - name: Upload Kotlin test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-results-${{ matrix.target }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          retention-days: 14
          if-no-files-found: ignore
      - if: env.SAVE_GO_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # The JVM-against-Go tests launch the real Go service.
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-key: binaries
      - name: Build Go binaries
        run: |
          make build-go
          cd go && go build -o bin/kdb-e2e-helper ./cmd/kdb-e2e-helper
      - name: Run integration tests
        env:
          # this job builds kdb-service above: the JVM-against-Go tests must run, not skip
          KDB_REQUIRE_GO_SERVICE: "1"
        # :kdb-integration:e2ePython is not run here any more: it ran the same pytest scenarios
        # as the e2e job (4 minutes of them), differing only in driving the test_cli_* files
        # with the JVM CLI - which e2e-interop now does.
        run: ./gradlew :kdb-integration:test --build-cache --parallel --no-daemon
      - if: env.SAVE_GO_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  ts-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kdb-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Go is needed for two things: regenerating the golden fixtures to prove they still match
      # the real encoder, and the live interop suite, which starts an actual Go server and
      # drives it from the TypeScript client over a real WebSocket.
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-key: ts-client
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Check golden fixtures are current
        # A drifted fixture is the failure this whole package guards against: the TS codec would
        # still agree with a stale snapshot of the Go encoder while disagreeing with a live
        # server. Regenerating and diffing catches a wire-format change on the Go side that
        # nobody thought to mirror here.
        run: |
          cd ../../go && go run ./cmd/kdb-tsfixtures
          cd ../packages/kdb-client
          if ! git diff --quiet -- test/golden; then
            echo "Golden fixtures are out of date - the Go wire format changed."
            echo "Run: cd go && go run ./cmd/kdb-tsfixtures"
            git diff -- test/golden
            exit 1
          fi
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - if: env.SAVE_GO_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # @kdb/codegen (Component 63 phase 2). Needs the built @kdb/client (a file: dependency) and Go for
  # the end-to-end suite, which runs the generated typed layer against a real Go server. It builds
  # the client itself, so it does not wait for ts-client.
  ts-codegen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kdb-codegen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-key: ts-codegen
      - name: Build @kdb/client
        run: cd ../kdb-client && npm ci && npm run build
      - name: Install
        run: npm ci
      - name: Typecheck (includes the compile-time type assertions)
        run: npm run typecheck
      - name: Test
        run: npm test
      - if: env.SAVE_GO_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # @kdb/embed (Component 63 phase 3): the Go engine compiled to WebAssembly, tested in Node against
  # the same typed suite and differentially against a real Go server.
  ts-embed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kdb-embed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-key: ts-embed
      - name: Build @kdb/client and @kdb/codegen
        run: |
          (cd ../kdb-client && npm ci && npm run build)
          (cd ../kdb-codegen && npm ci && npm run build)
      - name: Install
        run: npm ci
      - name: Test (builds the WASM engine first)
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - if: env.SAVE_GO_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # @kdb/replica (docs/kdb-client-replica-plan.md): a native TS replica. Its commit codec and trie
  # must be byte-identical to Go's, so the golden vectors are regenerated and diffed like the client's.
  ts-replica:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kdb-replica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-key: ts-replica
      # The replica reuses @kdb/client's framing and transports (a file: dependency).
      - name: Build @kdb/client
        run: cd ../kdb-client && npm ci && npm run build
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Check golden fixtures are current
        run: |
          cd ../../go && go run ./cmd/kdb-tsfixtures
          cd ../packages/kdb-replica
          if ! git diff --quiet -- test/golden; then
            echo "Golden fixtures are out of date - the Go commit or trie format changed."
            echo "Run: cd go && go run ./cmd/kdb-tsfixtures"
            git diff --stat -- test/golden
            exit 1
          fi
      # Includes the live interop suite, which builds go/cmd/kdb-replicahost and syncs against it.
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - if: env.SAVE_GO_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  go-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Use the Gradle build cache
        run: mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}" && printf 'org.gradle.caching=true\norg.gradle.parallel=true\n' >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-key: go-interop
      - name: Start JVM kdb-service (SQL wire over WebSocket)
        run: |
          ./gradlew :kdb-service:runService --no-daemon \
            --args="--listen-sql-ws kdb-ws://127.0.0.1:17444/kdb?bind=true --namespace demo/interop" \
            > /tmp/kdb-service.log 2>&1 &
          echo $! > /tmp/kdb-service.pid
      - name: Wait for kdb-service to accept connections
        # :kdb-service:runService has to configure and compile its whole dependency graph (50+
        # modules, several with JS/Native source sets Gradle still evaluates at configuration
        # time even though this task only needs the JVM target) before the service process even
        # starts - on a cold runner with no prior Gradle cache, that alone can take several
        # minutes, well past what a short fixed wait assumes. 90s here previously produced a
        # false failure: the log this step printed on timeout showed the build still mid-compile
        # (last task ~:kdb-config:jar), nowhere near actually running the service yet.
        run: |
          for i in $(seq 1 480); do
            if (exec 3<>/dev/tcp/127.0.0.1/17444) 2>/dev/null; then
              exec 3<&- 3>&-
              echo "kdb-service is accepting connections on 17444 (after ${i}s)"
              exit 0
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "still waiting for kdb-service to open port 17444 (${i}s elapsed)..."
            fi
            sleep 1
          done
          echo "kdb-service never opened port 17444 after 480s - server log follows:"
          cat /tmp/kdb-service.log || true
          exit 1
      - name: Cross-language interop tests
        working-directory: go
        env:
          KDB_JVM_SQL_WS_URI: ws://127.0.0.1:17444/kdb
        run: |
          set -o pipefail
          go test -tags interop ./kdb/interop/... ./kdb/client/... -v | tee /tmp/interop.log
          if grep -q '^--- SKIP' /tmp/interop.log; then
            echo "interop test(s) reported SKIP - KDB_JVM_SQL_WS_URI wasn't honored, failing the job"
            exit 1
          fi
      - name: Stop kdb-service
        if: always()
        run: kill "$(cat /tmp/kdb-service.pid)" 2>/dev/null || true
      - name: Upload kdb-service log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kdb-service-interop-log
          path: /tmp/kdb-service.log
          if-no-files-found: ignore
      - if: env.SAVE_GO_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # gomobile packaging (docs/kdb-distributed-implementation-plan.md Phase 16.8): an app embeds KDB's
  # sync node through a small gomobile-shaped facade (go/mobile/kdbsync) - binding go/kdb/embed
  # directly stopped working when its exported surface grew beyond what gomobile can proxy. The
  # sizes go to the job summary so growth is visible from one PR to the next.
  mobile-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-key: mobile-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install gomobile and gobind (the module's pinned x/mobile)
        # Both: gomobile shells out to gobind, and without it every bind fails with
        # "gobind was not found. Please run gomobile init before trying again".
        run: go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
      - name: Bind for Android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          gomobile bind -target=android/arm64,android/amd64 -androidapi 21 -o "$RUNNER_TEMP/kdbsync.aar" ./mobile/kdbsync
      - name: Record binary size
        run: |
          {
            echo "### gomobile: kdbsync (Android)"
            echo '| file | bytes |'
            echo '|---|---|'
            echo "| kdbsync.aar | $(stat -c %s "$RUNNER_TEMP/kdbsync.aar") |"
            unzip -l "$RUNNER_TEMP/kdbsync.aar" | awk '/\.so$/ {print "| " $4 " (uncompressed) | " $1 " |"}'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: env.SAVE_GO_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  mobile-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-key: mobile-ios
      - name: Install gomobile and gobind (the module's pinned x/mobile)
        # Both: gomobile shells out to gobind, and without it every bind fails with
        # "gobind was not found. Please run gomobile init before trying again".
        run: go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
      - name: Bind for iOS
        run: gomobile bind -target=ios -o "$RUNNER_TEMP/Kdbsync.xcframework" ./mobile/kdbsync
      - name: Record binary size
        run: |
          {
            echo "### gomobile: kdbsync (iOS)"
            echo '| slice | bytes |'
            echo '|---|---|'
            find "$RUNNER_TEMP/Kdbsync.xcframework" -name Kdbsync -type f | while read -r f; do
              echo "| $(basename "$(dirname "$(dirname "$f")")") | $(stat -f %z "$f") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - if: env.SAVE_GO_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

  # The pytest scenarios against the real Go service, dealt round-robin over three jobs
  # (conftest.py's --shard): server/cluster/destructive; interop/slow/s3 excluded.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-key: binaries
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Go binaries
        run: |
          make build-go
          cd go && go build -o bin/kdb-e2e-helper ./cmd/kdb-e2e-helper
      - name: Install pytest
        run: pip install -q -r kdb-integration/e2e/requirements.txt
      - name: Install ffmpeg
        # The attachment tests generate and decode MP4 media (kdb-integration/e2e/media_fixtures.py).
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Run e2e scenarios (shard ${{ matrix.shard }} of 3)
        working-directory: kdb-integration/e2e
        run: python -m pytest -v --durations=15 --shard ${{ matrix.shard }}/3
      - name: Upload e2e failure evidence
        # Data directories, every launch's service log and kdb-inspect output, kept by
        # preserve_evidence() when a crash or cluster scenario fails - the only way to examine a
        # failure that shows up on a runner and not on a laptop (issue #43).
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          path: kdb-integration/e2e/evidence/
          if-no-files-found: ignore
          retention-days: 14

  e2e-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-go-cached
        with:
          cache-key: binaries
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Go binaries
        run: |
          make build-go
          cd go && go build -o bin/kdb-e2e-helper ./cmd/kdb-e2e-helper
      - name: Build JVM CLI classpath
        run: ./gradlew :kdb-cli:writeCliClasspath :kdb-cli:jar --build-cache --parallel --no-daemon
      - name: Install pytest
        run: pip install -q -r kdb-integration/e2e/requirements.txt
      - name: Run interop e2e scenarios (differential Go vs JVM CLI)
        working-directory: kdb-integration/e2e
        env:
          KDB_CLI_CLASSPATH_FILE: ${{ github.workspace }}/kdb-cli/build/cli-classpath.txt
        run: python -m pytest -v -m interop
      - name: Run the CLI scenarios against the JVM CLI
        # The e2e job runs these against the Go CLI; with a classpath and no KDB_CLI_BIN they
        # drive the JVM one, which :kdb-integration:e2ePython used to cover.
        working-directory: kdb-integration/e2e
        env:
          KDB_CLI_CLASSPATH_FILE: ${{ github.workspace }}/kdb-cli/build/cli-classpath.txt
        run: python -m pytest -v test_cli_*.py

  # Both toolchains, because the golden fixtures now run in both directions: Kotlin exports the
  # ones Go checks, Go exports the ones Kotlin checks. Either encoder drifting is a physical
  # format change, and a physical format change that nobody noticed is exactly what breaks a
  # mixed Go/JVM deployment. See docs/kdb-physical-layer-compat-test-plan.md.
  golden-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - id: go
        uses: ./.github/actions/setup-go-cached
        with:
          cache-key: golden
      - name: Regenerate the Kotlin-side fixtures
        # --rerun-tasks: the exporters must run, not come from the build cache.
        run: |
          ./gradlew :kdb-integration:test --tests "dev.kdb.integration.ExportGoldenTest" \
                    :kdb-storage-wal:jvmTest :kdb-storage-sstable:jvmTest \
                    :kdb-storage-delta:jvmTest :kdb-compression:jvmTest --rerun-tasks --parallel --no-daemon
      # This both regenerates the Go-side fixtures and verifies each side against the other's,
      # so a genuine incompatibility fails here as a test failure rather than only as drift.
      - name: Regenerate the Go-side fixtures and run the conformance suite
        run: cd go && go test ./kdb/interop/... -count=1 -v
      - name: Fail on drift
        run: |
          if ! git diff --exit-code go/testdata/golden/; then
            echo "go/testdata/golden/ is stale: one side's encoder now produces different bytes."
            echo "If the format change is deliberate, review the diff and commit the fixtures."
            echo "Regenerate locally with: make test-physical-golden"
            exit 1
          fi
          # git diff ignores untracked files, so a fixture an exporter writes but nobody committed
          # would pass the check above while the Go side silently skips it everywhere else.
          untracked="$(git ls-files --others --exclude-standard -- go/testdata/golden/)"
          if [ -n "$untracked" ]; then
            echo "go/testdata/golden/ has fixtures an exporter writes that are not committed:"
            echo "$untracked"
            exit 1
          fi
      - if: env.SAVE_GO_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.paths }}
          key: ${{ steps.go.outputs.key }}

