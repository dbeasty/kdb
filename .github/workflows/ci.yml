name: CI

# Manual only — re-enable push/pull_request when CI is stable again.
on:
  workflow_dispatch:
#  push:
#  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run integration tests
        run: ./gradlew :kdb-integration:test :kdb-integration:e2ePython --no-daemon

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Go test
        working-directory: go
        run: go test -race ./...
      - name: Go WASM build
        working-directory: go
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./wasm/demo/

  go-interop:
    runs-on: ubuntu-latest
    needs: [integration, go-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Cross-language interop tests
        working-directory: go
        run: go test ./kdb/interop/... -v
