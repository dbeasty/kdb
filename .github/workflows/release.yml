# Tag-triggered release pipeline (docs/kdb-release-plan.md): test gate, cross-compiled binaries,
# the embeddable Go source bundle, Kotlin jars, checksums as a GitHub release, and a container
# image pushed to GHCR.
#
# Cut a release with:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag (minus the leading "v") becomes the version injected into every binary
# (go/kdb/version.Version) and the image tag. The tagged commit is injected alongside it, so
# `kdb --version`, the service banner, /healthz and the kdb_build_info metric all name the exact
# source a released artifact was built from.
#
# Every build step below is a single `make` target (see the root Makefile) - there is no build
# logic here that a developer can't run identically on a laptop. That's what makes
# `make release-verify TAG=v0.1.0` (or `./scripts/release-verify.sh v0.1.0`) a real reproduction
# of this workflow's output rather than a separate, possibly-diverging path.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Fails fast if a tag doesn't agree with the repo's own version file - otherwise binaries and
  # jars would silently disagree about what version they claim to be.
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match VERSION
        run: |
          want="v$(cat VERSION)"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION file (expected $want) - bump VERSION and retag" >&2
            exit 1
          fi
      # @kdb/client is published at the server's version: its handshake refuses any other
      # release, so a package that disagrees with VERSION would be refused by its own server.
      - name: "@kdb/client must match VERSION"
        run: |
          got="$(node -p "require('./packages/kdb-client/package.json').version")"
          want="$(cat VERSION)"
          if [ "$got" != "$want" ]; then
            echo "packages/kdb-client/package.json is $got but VERSION is $want - bump both together" >&2
            exit 1
          fi

  test-gate:
    needs: version-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Go tests (race)
        # The nightly's full race run (e2e-nightly.yml go-race-full) uses the same limit: under -race
        # on a GitHub runner, embed and integration take past Go's default 10m per package, which
        # killed v0.8.0's first release run before it built anything.
        run: cd go && go test -race -timeout 45m ./...
      - name: Go vet + gofmt
        run: cd go && go vet ./... && test -z "$(gofmt -l .)"

  artifacts:
    needs: test-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build binaries, embeddable source bundle, jars and checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # A tag build is a clean checkout by definition, hence GIT_DIRTY=false. RELEASE_DATE
          # comes from the tagged commit's own timestamp, not "now" - see docs/kdb-release-plan.md
          # §3 on why that's required for a rebuild of this same tag to reproduce byte-for-byte.
          make release-all \
            VERSION="$VERSION" GIT_COMMIT="$GITHUB_SHA" GIT_DIRTY=false \
            RELEASE_DATE="$(git log -1 --format=%cI "$GITHUB_SHA")"
      - name: Verify the embeddable bundle builds standalone
        run: ./scripts/verify-bundle.sh dist/bundle/kdb-go-embed-*.zip
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bin/*
            dist/bundle/*.zip
            dist/jars/*
            dist/SHA256SUMS
          generate_release_notes: true

  # The TypeScript client, published once per release at the server's own version. The tarball is
  # always attached to the GitHub release; the registry publish needs an NPM_TOKEN secret (an
  # automation token for the @kdb scope) and is skipped, loudly, without one.
  npm-client:
    needs: test-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: packages/kdb-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: npm ci
      - run: npm run typecheck
      # Includes the live interop suite against a real Go server, so the package is only
      # published if it speaks to the server built from this very tag.
      - run: npm test
      - run: npm run build
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Attach the tarball to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/kdb-client-*.tgz
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set - @kdb/client was NOT published to the registry (the tarball is on the release)"
            exit 0
          fi
          npm publish --access public --provenance

  image:
    needs: test-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            GIT_DIRTY=false
          tags: |
            ghcr.io/${{ github.repository }}/kdb-service:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/kdb-service:latest
