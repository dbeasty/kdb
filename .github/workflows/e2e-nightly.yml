# Nightly long-running e2e: slow load/compaction/large-history scenarios plus (when secrets are
# configured) the LocalStack S3 backup variant (kdb-finish-up-plan Phase 3.2 CI wiring).
name: E2E Nightly

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  e2e-slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Go binaries
        run: |
          make build-go
          cd go && go build -o bin/kdb-e2e-helper ./cmd/kdb-e2e-helper
      - name: Install pytest
        run: pip install -q -r kdb-integration/e2e/requirements.txt
      - name: Run slow + destructive scenarios
        working-directory: kdb-integration/e2e
        # Upgrade tests have their own job (e2e-upgrade), which builds the previous release.
        run: python -m pytest -v -m "(slow or destructive) and not upgrade"
      - name: Upload e2e failure evidence
        # Data directories, every launch's service log and kdb-inspect output, kept by
        # preserve_evidence() when a crash or cluster scenario fails - the only way to examine a
        # failure that shows up on a runner and not on a laptop (issue #43).
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-nightly-${{ github.run_attempt }}
          path: kdb-integration/e2e/evidence/
          if-no-files-found: ignore
          retention-days: 14

  e2e-upgrade:
    # Mixed-version clusters (kdb-integration/e2e/test_upgrade.py): a v0.6.2 mesh upgraded to this
    # build one node at a time under load, crashed nodes recovered by the new binary, a 2-old +
    # 3-new mesh with kills, a snapshot joiner served by v0.6.2, SQL across versions, and what a
    # rollback to v0.6.2 keeps. ~5 minutes, so nightly rather than per PR.
    runs-on: ubuntu-latest
    env:
      PREV_TAG: v0.6.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the previous release tag
        run: git fetch --no-tags --depth=1 origin "+refs/tags/${PREV_TAG}:refs/tags/${PREV_TAG}"
      - name: Build the previous release's kdb-service
        run: make build-prev-service PREV_TAG="${PREV_TAG}"
      - name: Build this build's Go binaries
        run: |
          make build-go
          cd go && go build -o bin/kdb-e2e-helper ./cmd/kdb-e2e-helper
      - name: Install pytest
        run: pip install -q -r kdb-integration/e2e/requirements.txt
      - name: Run upgrade scenarios
        working-directory: kdb-integration/e2e
        run: |
          export KDB_SERVICE_BIN_PREV="$GITHUB_WORKSPACE/go/bin/prev/kdb-service-${PREV_TAG}"
          "$KDB_SERVICE_BIN_PREV" --version
          python -m pytest -v -rxXs -m upgrade test_upgrade.py
      - name: Upload e2e failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-upgrade-${{ github.run_attempt }}
          path: kdb-integration/e2e/evidence/
          if-no-files-found: ignore
          retention-days: 14

  kill9-soak:
    # Issue #43 (U6b in docs/kdb-open-issues-plan.md): SIGKILL the real kdb-service at random
    # moments under concurrent writes over the wire, 150 times on one data directory, and check
    # every acknowledged write after each restart. The issue was only ever seen on a Linux runner;
    # local soaks are on macOS, so this is where the Linux evidence comes from. The child runs
    # with GOMAXPROCS=2. On failure the data directory and every launch's log are uploaded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Kill -9 soak, default durability
        working-directory: go
        env:
          KDB_KILL9_ITERATIONS: "150"
          TMPDIR: ${{ runner.temp }}
        run: go test -count=1 -timeout 50m -run TestServerKill9 -v ./kdb/integration/
      - name: Kill -9 soak, checkpoints mid-load
        working-directory: go
        env:
          KDB_KILL9_ITERATIONS: "60"
          KDB_KILL9_SERVICE_ARGS: "--maintenance-interval 200ms"
          TMPDIR: ${{ runner.temp }}
        run: go test -count=1 -timeout 30m -run TestServerKill9 -v ./kdb/integration/
      - name: Upload kill -9 evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kill9-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kdb-kill9-data-*
          if-no-files-found: ignore
          retention-days: 14

  s3-integration:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3
        ports: ["4566:4566"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Run S3 integration tests against LocalStack
        working-directory: go
        env:
          KDB_S3_BUCKET: kdb-ci
          KDB_S3_ENDPOINT: http://127.0.0.1:4566
          KDB_S3_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        # EnsureBucket in the test config creates the bucket itself.
        run: go test -tags s3integration ./kdb/storage/io/s3/... -v
