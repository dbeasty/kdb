[pytest]
testpaths = .
markers =
    server: launches a real kdb-service process
    cluster: launches multiple kdb-service processes wired for peer sync
    interop: requires the JVM (Kotlin) service or CLI - excluded from the default local run
    slow: long-running load/compaction scenarios
    destructive: kill -9 / corruption scenarios
    s3: requires LocalStack or real S3 (KDB_S3_* env)
addopts = -m "not interop and not slow and not s3"
